# ─────────────────────────────────────────────────────────────────────────────
# EditorsHub-AURA Bot — GitHub Actions workflow
#
# TWO MODES — choose one:
#
# MODE A: GitHub-hosted runner (public repos only — unlimited free minutes)
#   → runs-on: ubuntu-latest
#
# MODE B: Self-hosted runner on YOUR OWN MACHINE (private repos — fully free)
#   → runs-on: self-hosted
#   → Install the runner agent on your PC/laptop once:
#      repo → Settings → Actions → Runners → New self-hosted runner → follow steps
#   → The bot then runs ON YOUR MACHINE, GitHub just orchestrates restarts
#
# Currently configured for MODE B (self-hosted) — change runs-on if needed.
# ─────────────────────────────────────────────────────────────────────────────

name: EditorsHub Bot — 24/7

on:
  schedule:
    # Restart at 00:00, 06:00, 12:00, 18:00 UTC — 4 times/day
    # Each run lasts ~5h 50m, ~10 min gap at each restart
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:     # manual "Run workflow" button in Actions tab
  push:
    branches: [master]   # auto-restart on every push

# Prevents two bot instances running simultaneously (avoids duplicate polling)
concurrency:
  group: editorshub-bot
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run EditorsHub Bot
    # ── Change to ubuntu-latest if you make the repo public ──────────────────
    runs-on: self-hosted
    timeout-minutes: 350    # 5h 50m — exits cleanly before GitHub's 6h limit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        working-directory: editorshub_aura
        run: python bot.py
        env:
          BOT_TOKEN:             ${{ secrets.BOT_TOKEN }}
          SUPER_ADMIN_ID:        ${{ secrets.SUPER_ADMIN_ID }}
          ADMIN_ID:              ${{ secrets.ADMIN_ID }}
          JOBS_CHANNEL_ID:       ${{ secrets.JOBS_CHANNEL_ID }}
          EDITORS_COMMUNITY_ID:  ${{ secrets.EDITORS_COMMUNITY_ID }}
          GOOGLE_SHEET_KEY:      ${{ secrets.GOOGLE_SHEET_KEY }}
          GOOGLE_CREDENTIALS:    ${{ secrets.GOOGLE_CREDENTIALS }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
