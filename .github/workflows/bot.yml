# EditorsHub-AURA Bot — 24/7 on GitHub-hosted servers (free, unlimited minutes)
# Repo is public → code visible, but ALL secrets stay safe in GitHub Secrets.
# Nobody can run your bot without your BOT_TOKEN and Google credentials.

name: EditorsHub Bot — 24/7

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 UTC every day (4 restarts / day)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:   # "Run workflow" button in the Actions tab
  push:
    branches: [master] # auto-restart on every push to master

# Kills the old run before starting a new one → no duplicate polling
concurrency:
  group: editorshub-bot
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run EditorsHub Bot
    runs-on: ubuntu-latest      # GitHub's free Linux server
    timeout-minutes: 350        # 5h 50m — exits cleanly before GitHub's 6h limit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip            # caches packages → faster restarts

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        working-directory: editorshub_aura
        run: python bot.py
        env:
          BOT_TOKEN:             ${{ secrets.BOT_TOKEN }}
          SUPER_ADMIN_ID:        ${{ secrets.SUPER_ADMIN_ID }}
          ADMIN_ID:              ${{ secrets.ADMIN_ID }}
          JOBS_CHANNEL_ID:       ${{ secrets.JOBS_CHANNEL_ID }}
          EDITORS_COMMUNITY_ID:  ${{ secrets.EDITORS_COMMUNITY_ID }}
          GOOGLE_SHEET_KEY:      ${{ secrets.GOOGLE_SHEET_KEY }}
          GOOGLE_CREDENTIALS:    ${{ secrets.GOOGLE_CREDENTIALS }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
